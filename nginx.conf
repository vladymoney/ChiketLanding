server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;
    charset      utf-8;

    # index.html is a single ~3.3 MB file with every asset inlined as base64.
    # The image ships a precompressed copy, so nginx hands that over instead of
    # gzipping several megabytes on every request.
    gzip_static on;
    gzip        on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types  text/css application/javascript image/svg+xml application/json;
    gzip_vary   on;

    # One page, no content-hashed filenames: always revalidate, or a redeploy
    # goes unseen behind a cached copy.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # og.jpg is content-stable; let it cache.
    location = /og.jpg {
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Google Play needs the privacy and deletion URLs to resolve to those pages
    # themselves, not to whatever the catch-all would serve.
    location = /privacy {
        default_type text/html;
        try_files /privacy.html =404;
    }

    location = /delete-account {
        default_type text/html;
        try_files /delete-account.html =404;
    }

    location = /beta-terms {
        default_type text/html;
        try_files /beta-terms.html =404;
    }

    # Was `try_files $uri $uri/ /index.html`, which answered EVERY path with the
    # landing page and HTTP 200 - so /privacy looked like it existed and served
    # marketing copy instead. Unknown paths now 404 honestly; "/" still resolves
    # to index.html through the index directive.
    location / {
        try_files $uri $uri/ =404;
    }
}
