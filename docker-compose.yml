services:
  landing:
    build: .
    image: chiket-landing:latest
    container_name: chiket-landing
    restart: unless-stopped
    ports:
      # Override on the VPS with:  PORT=80 docker compose up -d
      - "${PORT:-8080}:80"
    healthcheck:
      # localhost is ::1 in this image and nginx binds IPv4 only - name the address
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
